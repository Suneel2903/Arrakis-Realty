[project]
name = "rera-pipeline"
version = "0.1.0"
description = "K-RERA fetch, parse, locate, enrich and export for the Arrakis map"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
# Only the Google Maps candidate finder needs a browser.
gmaps = ["playwright>=1.56"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rera_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
