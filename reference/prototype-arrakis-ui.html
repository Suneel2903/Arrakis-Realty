<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arrakis Realty: Bengaluru homes at one fair price</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --night:#0B1A30; --night-2:#0E213B; --dune:#132744; --dune-2:#1A3356; --line:#26426B;
  --spice:#F29A38; --spice-soft:rgba(242,154,56,.14); --ice:#6FB7FF; --sand:#E6D3AE;
  --ink:#EDF1F7; --ink-2:#A9B7CC; --ink-3:#7688A3;
  --good:#5BC98C; --warn:#F2C94C; --bad:#F2767A; --law:#C9A8FF;
  --display:'Syne', 'Avenir Next', 'Segoe UI', sans-serif;
  --body:'IBM Plex Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --r-s:6px; --r-m:10px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px); background:var(--night)}
body{margin:0; background:var(--night); color:var(--ink); font:15px/1.55 var(--body); -webkit-font-smoothing:antialiased}
a{color:var(--spice)}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--spice); outline-offset:2px}
h1,h2,h3{font-family:var(--display); font-weight:700; letter-spacing:.005em; margin:0}
h1{font-size:clamp(34px,5vw,58px); line-height:1.02}
h2{font-size:clamp(24px,3vw,32px); line-height:1.1}
h3{font-size:18px; line-height:1.25}
p{margin:0 0 .8em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.wrap{max-width:1180px; margin:0 auto; padding:0 20px}

/* top bar */
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:40; display:flex; align-items:center; gap:18px; padding:10px 20px;
  background:rgba(11,26,48,.86); backdrop-filter:blur(10px); border-bottom:1px solid rgba(38,66,107,.6)}
.brand{font-family:var(--display); font-weight:800; font-size:20px; letter-spacing:.2em; color:var(--sand); text-decoration:none; padding-left:.2em; white-space:nowrap}
.nav{display:flex; gap:4px; flex-wrap:wrap}
.nav a{color:var(--ink-2); text-decoration:none; padding:6px 10px; border-radius:var(--r-s); font-size:14px}
.nav a:hover{color:var(--ink)} .nav a.on{color:var(--ink); background:var(--dune)}
.spacer{flex:1}
.rolepick{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-3)}
.rolepick select{background:var(--dune); border:1px solid var(--line); border-radius:var(--r-s); padding:5px 8px}
.demo-flag{font-size:12px; color:var(--night); background:var(--sand); padding:2px 8px; border-radius:20px; font-weight:600}

/* buttons, fields */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:0; cursor:pointer; border-radius:var(--r-s);
  padding:11px 18px; font-weight:600; background:var(--spice); color:#1A1206; text-decoration:none}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent; color:var(--ink); border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--ink-3)}
.btn.small{padding:6px 11px; font-size:13px}
.btn.danger{background:transparent; color:var(--bad); border:1px solid rgba(242,118,122,.4)}
.btn[disabled]{opacity:.45; cursor:not-allowed; filter:none}
label.f{display:block; font-size:13px; color:var(--ink-2); margin:0 0 12px}
label.f input,label.f select,label.f textarea{display:block; width:100%; margin-top:4px; background:var(--night-2); border:1px solid var(--line); border-radius:var(--r-s); padding:9px 10px; color:var(--ink)}
.check{display:flex; gap:10px; align-items:flex-start; font-size:14px; margin:0 0 10px; color:var(--ink)}
.check input{margin-top:4px; accent-color:var(--spice); width:16px; height:16px; flex:none}

/* compliance marker */
.law{display:inline-flex; align-items:center; gap:5px; font-size:12px; color:var(--law); border:1px solid rgba(201,168,255,.35); border-radius:20px; padding:1px 8px 1px 6px; vertical-align:middle; white-space:nowrap; cursor:help}
.law svg{width:11px; height:11px}
.lawnote{border-left:2px solid var(--law); padding:8px 12px; background:rgba(201,168,255,.07); color:var(--ink); font-size:13.5px; border-radius:0 var(--r-s) var(--r-s) 0; margin:10px 0}

/* hero map */
.hero{position:relative; min-height:calc(100vh - 58px); display:grid; grid-template-columns:minmax(300px,420px) 1fr; overflow:hidden}
.hero-copy{position:relative; z-index:2; padding:56px 28px 32px 32px; display:flex; flex-direction:column; gap:18px;
  background:linear-gradient(90deg, var(--night) 70%, rgba(11,26,48,0))}
.hero-copy h1{font-size:clamp(34px,3.6vw,48px)}
.hero-copy .lede{font-size:17px; color:var(--ink-2); max-width:36ch}
.price-line{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
.price-line b{font-family:var(--display); font-size:30px; color:var(--spice)}
.mapbox{position:relative; min-height:520px}
#map{position:absolute; inset:0; width:100%; height:100%; display:block; cursor:crosshair}
.maptip{position:absolute; pointer-events:none; background:rgba(14,33,59,.95); border:1px solid var(--line); border-radius:var(--r-s); padding:6px 10px; font-size:13px; transform:translate(12px,-50%); white-space:nowrap; display:none; z-index:3}
.legend{position:absolute; left:16px; bottom:14px; z-index:3; display:flex; gap:14px; flex-wrap:wrap; font-size:12.5px; color:var(--ink-2); background:rgba(11,26,48,.7); padding:8px 12px; border-radius:var(--r-s)}
.legend i{display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; vertical-align:-1px}
.mapctl{position:absolute; right:16px; top:14px; z-index:3; display:flex; gap:6px}
.mapctl button{background:rgba(19,39,68,.9); border:1px solid var(--line); color:var(--ink-2); border-radius:var(--r-s); padding:6px 10px; font-size:12.5px; cursor:pointer}
.mapctl button.on{color:var(--ink); border-color:var(--spice)}
.attrib{position:absolute; right:12px; bottom:10px; z-index:3; font-size:11px; color:var(--ink-3)}

/* market panel */
.panel{position:absolute; top:60px; right:16px; width:min(360px, calc(100% - 32px)); max-height:calc(100% - 110px); overflow:auto; z-index:4;
  background:rgba(14,33,59,.97); border:1px solid var(--line); border-radius:var(--r-m); padding:18px; display:none}
.panel.open{display:block}
.panel .x{position:absolute; right:10px; top:8px; background:none; border:0; color:var(--ink-2); font-size:22px; cursor:pointer; line-height:1}
.kv{display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:13.5px; margin:12px 0}
.kv dt{color:var(--ink-3)} .kv dd{margin:0}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 14px}
.chip{font-size:12.5px; padding:3px 9px; border-radius:20px; border:1px solid var(--line); color:var(--ink-2); background:none; cursor:pointer}
.chip.hot{border-color:var(--spice); color:var(--spice)}
.projcard{border:1px solid var(--spice); background:var(--spice-soft); border-radius:var(--r-m); padding:14px; margin:12px 0}

/* sections */
section.band{padding:72px 0; border-top:1px solid rgba(38,66,107,.5)}
.steps{display:grid; grid-template-columns:repeat(4,1fr); gap:28px; margin-top:32px; counter-reset:s}
.steps li{list-style:none; counter-increment:s; position:relative; padding-top:44px}
.steps li::before{content:counter(s); position:absolute; top:0; left:0; font-family:var(--display); font-size:28px; color:var(--spice)}
.steps h3{margin-bottom:6px}
.split{display:grid; grid-template-columns:1.1fr 1fr; gap:48px; align-items:start}
.compare{width:100%; border-collapse:collapse; font-size:14.5px}
.compare th,.compare td{text-align:left; padding:10px 12px; border-bottom:1px solid var(--line)}
.compare th{color:var(--ink-3); font-weight:500}
.compare td:last-child{color:var(--sand)}

/* page frame */
.page{padding:36px 0 80px}
.pagehead{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:24px}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:20px; align-items:start}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:20px}
.box{background:var(--dune); border:1px solid var(--line); border-radius:var(--r-m); padding:20px}
.box h3{margin-bottom:10px}
.box.key{border-color:var(--spice)}
.tbl{width:100%; border-collapse:collapse; font-size:13.5px}
.tbl th{position:sticky; top:0; text-align:left; font-weight:500; color:var(--ink-3); background:var(--dune); padding:8px 10px; border-bottom:1px solid var(--line)}
.tbl td{padding:8px 10px; border-bottom:1px solid rgba(38,66,107,.6); vertical-align:top}
.tbl tr.click{cursor:pointer} .tbl tr.click:hover td{background:var(--dune-2)}
.scroll{overflow-x:auto}
.status{display:inline-block; font-size:12px; padding:2px 8px; border-radius:20px; border:1px solid var(--line); white-space:nowrap}
.status.ok{color:var(--good); border-color:rgba(91,201,140,.4)} .status.wait{color:var(--warn); border-color:rgba(242,201,76,.4)}
.status.no{color:var(--bad); border-color:rgba(242,118,122,.4)} .status.spice{color:var(--spice); border-color:rgba(242,154,56,.45)}
.locked{position:relative}
.locked .veil{position:absolute; inset:0; backdrop-filter:blur(6px); background:rgba(19,39,68,.55); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; text-align:center; padding:20px; border-radius:var(--r-m)}

/* journey tracker */
.track{display:flex; gap:0; margin:8px 0 4px; overflow-x:auto; padding-bottom:6px}
.track div{flex:1 0 110px; position:relative; padding-top:22px; font-size:12.5px; color:var(--ink-3)}
.track div::before{content:""; position:absolute; top:6px; left:0; right:0; height:2px; background:var(--line)}
.track div::after{content:""; position:absolute; top:1px; left:0; width:12px; height:12px; border-radius:50%; background:var(--night); border:2px solid var(--line)}
.track div.done{color:var(--ink-2)} .track div.done::before{background:var(--spice)} .track div.done::after{background:var(--spice); border-color:var(--spice)}
.track div.now{color:var(--ink); font-weight:600} .track div.now::after{background:var(--night); border-color:var(--spice); box-shadow:0 0 0 4px var(--spice-soft)}

/* messages */
.wa{display:flex; flex-direction:column; gap:8px; max-height:340px; overflow:auto}
.wa .m{background:#123127; border:1px solid #1E4B3B; border-radius:10px 10px 10px 2px; padding:8px 12px; font-size:13.5px; max-width:92%}
.wa .m small{display:block; color:var(--ink-3); font-size:11.5px; margin-top:2px}

/* admin */
.admin{display:grid; grid-template-columns:210px 1fr; min-height:calc(100vh - 58px)}
.side{border-right:1px solid var(--line); padding:18px 10px; position:sticky; top:58px; align-self:start; height:calc(100vh - 58px); overflow:auto}
.side a{display:flex; justify-content:space-between; color:var(--ink-2); text-decoration:none; padding:8px 12px; border-radius:var(--r-s); font-size:14px}
.side a.on{background:var(--dune); color:var(--ink)} .side a:hover{color:var(--ink)}
.side .cnt{font-size:12px; background:var(--spice); color:#1A1206; border-radius:20px; padding:0 7px; font-weight:600}
.side hr{border:0; border-top:1px solid var(--line); margin:10px 6px}
.main{padding:28px 28px 80px; min-width:0}
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; margin-bottom:20px}
.kpi{background:var(--dune); border:1px solid var(--line); border-radius:var(--r-m); padding:14px 16px}
.kpi b{display:block; font-family:var(--display); font-size:26px; margin-top:2px}
.kpi span{font-size:12.5px; color:var(--ink-3)}
.kanban{display:grid; grid-auto-flow:column; grid-auto-columns:minmax(210px,1fr); gap:12px; overflow-x:auto; padding-bottom:10px}
.col{background:var(--night-2); border:1px solid var(--line); border-radius:var(--r-m); padding:10px; min-height:200px}
.col h4{margin:2px 4px 10px; font-size:13px; color:var(--ink-2); font-weight:600; display:flex; justify-content:space-between}
.card{background:var(--dune); border:1px solid var(--line); border-radius:var(--r-s); padding:9px 10px; margin-bottom:8px; cursor:pointer; font-size:13px}
.card:hover{border-color:var(--ink-3)} .card b{display:block; font-size:13.5px}
.drawer{position:fixed; top:0; right:0; bottom:0; width:min(520px,100%); background:var(--night-2); border-left:1px solid var(--line); z-index:60; overflow:auto; padding:22px 22px 60px; transform:translateX(100%); transition:transform .22s ease}
.drawer.open{transform:none}
.scrim{position:fixed; inset:0; background:rgba(3,8,16,.55); z-index:55; display:none} .scrim.open{display:block}
.timeline{border-left:1px solid var(--line); margin:10px 0 0 6px; padding-left:16px}
.timeline div{position:relative; font-size:13px; margin-bottom:10px}
.timeline div::before{content:""; position:absolute; left:-20px; top:6px; width:7px; height:7px; border-radius:50%; background:var(--spice)}
.perm td{text-align:center; cursor:pointer; font-weight:600; user-select:none}
.perm td:first-child{text-align:left; cursor:default; font-weight:400}
.perm .F{color:var(--good)} .perm .A{color:var(--ice)} .perm .E{color:var(--warn)} .perm .V{color:var(--ink-2)} .perm .O{color:var(--spice)} .perm .N{color:var(--ink-3)}
.toggle{position:relative; width:38px; height:22px; flex:none}
.toggle input{opacity:0; width:0; height:0}
.toggle span{position:absolute; inset:0; background:var(--line); border-radius:22px; cursor:pointer; transition:background .15s}
.toggle span::after{content:""; position:absolute; left:3px; top:3px; width:16px; height:16px; background:var(--ink); border-radius:50%; transition:transform .15s}
.toggle input:checked + span{background:var(--spice)} .toggle input:checked + span::after{transform:translateX(16px)}
.hash{font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; color:var(--ink-3)}

/* modal + toast */
.modal{position:fixed; inset:0; z-index:70; display:none; align-items:center; justify-content:center; background:rgba(3,8,16,.6); padding:20px}
.modal.open{display:flex}
.modal .sheet{background:var(--night-2); border:1px solid var(--line); border-radius:var(--r-m); width:min(560px,100%); max-height:88vh; overflow:auto; padding:24px}
.toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); z-index:80; background:var(--sand); color:#1A1206; padding:10px 16px; border-radius:var(--r-s); font-weight:500; font-size:14px; display:none; max-width:90vw}
.toast.show{display:block}

footer{border-top:1px solid var(--line); padding:32px 0 48px; font-size:13px; color:var(--ink-3)}
footer .cols{display:grid; grid-template-columns:2fr 1fr 1fr; gap:24px}
footer a{color:var(--ink-2)}
footer button.linkish{background:none; border:0; padding:0; color:var(--ink-2); text-decoration:underline; cursor:pointer; font-size:13px}

@media (max-width:900px){
  .hero{grid-template-columns:1fr; min-height:auto}
  .hero-copy{background:var(--night); padding:32px 20px 20px}
  .mapbox{min-height:78vh}
  .panel{top:auto; bottom:52px; right:8px; left:8px; width:auto; max-height:48%}
  .steps{grid-template-columns:1fr 1fr}
  .split,.grid2,.grid3{grid-template-columns:1fr}
  .admin{grid-template-columns:1fr}
  .side{position:static; height:auto; display:flex; flex-wrap:wrap; gap:4px; border-right:0; border-bottom:1px solid var(--line)}
  .side hr{display:none}
  .main{padding:20px 16px 60px}
  footer .cols{grid-template-columns:1fr}
  .nav{order:3; width:100%}
  .top{flex-wrap:wrap}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important; animation:none!important} }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#/" aria-label="Arrakis Realty home">ARRAKIS REALTY</a>
  <nav class="nav" id="nav"></nav>
  <div class="spacer"></div>
  <div class="rolepick"><span class="demo-flag">Prototype</span><label for="role">Viewing as</label>
    <select id="role">
      <option>Customer</option><option>Admin</option><option>Sales manager</option><option>Sales executive</option><option>Compliance officer</option><option>Viewer</option>
    </select></div>
</header>
<div id="app"></div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Details"></aside>
<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

/* ================= AUDIT (hash-chained) ================= */
function h32(str){ let h = 2166136261 >>> 0; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return h.toString(16).padStart(8,'0'); }
function logAudit(who, action, entity, before, after, reason){
  const prev = S.audit.length ? S.audit[S.audit.length-1].hash : '00000000';
  const e = {id:S.audit.length + 1, ts:now(), who, action, entity, before:String(before ?? ''), after:String(after ?? ''), reason:reason || '', prev};
  e.hash = h32(prev + JSON.stringify([e.id,e.ts,e.who,e.action,e.entity,e.before,e.after,e.reason]));
  S.audit.push(e);
}
function verifyChain(){
  let prev = '00000000';
  for (const e of S.audit) { const h = h32(prev + JSON.stringify([e.id,e.ts,e.who,e.action,e.entity,e.before,e.after,e.reason])); if (e.prev !== prev || e.hash !== h) return e.id; prev = e.hash; }
  return 0;
}

function fire(tid, leadId, note){
  const tr = TRIGGERS.find(x => x[0] === tid); if (!tr) return false;
  if (!S.trig[tid]) { S.autolog.unshift({ts:now(), tid, name:tr[1], actions:'Skipped (trigger switched off)', lead:leadId}); return false; }
  S.autolog.unshift({ts:now(), tid, name:tr[1], actions:tr[2] + (note ? ' · ' + note : ''), lead:leadId});
  S.autolog = S.autolog.slice(0, 300);

}

function decide(id, ok, reason){
  const a = S.approvals.find(x => x.id === id); if (!a || a.status !== 'Pending') return;

  if (!(S.role === approverRole || S.role === 'Super admin' || (S.role === 'Admin' && approverRole !== 'Super admin'))) { toast(`Only ${approverRole} can decide ${a.wf}.`); return; }
  const self = a.maker === S.role;
  if (self && !S.settings.selfApprove) { toast('Self-approval is switched off in Settings.'); return; }
  if (self && !reason) { toast('Self-approval needs a reason; it is flagged in the audit trail.'); return; }
  a.status = ok ? 'Approved' : 'Rejected'; a.decidedBy = S.role; a.decidedAt = now(); a.reason = reason || '';
  logAudit(S.role, ok ? 'Approved' : 'Rejected', a.id + ' ' + a.wf, 'Pending', a.status, (self ? '[SELF-APPROVAL] ' : '') + (reason || ''));

}

function refundCalc(l){
  const within = l.paidAt && now() - l.paidAt <= S.settings.refundDays * DAY;
  const rides = l.rideCost || 0;
  const reports = S.requests.filter(r => r.lead === l.id && r.status === 'Delivered').length;
  const full = Math.round(feeTotal());
  const amount = Math.max(0, full - rides - reports * S.settings.reportDeduction * (1 + GST));
  return {within, rides, reports, full, amount:Math.round(amount), auto: within && !rides && !reports};
}
function processRefund(l, amount, ref){
  const cn = 'CN-' + (S.seq.cn++);
  l.refunded = (l.refunded || 0) + amount;
  if (amount >= Math.round(feeTotal())) { l.access = false; l.markets = []; }
  fire('T57', l.id, ref);
  setStage(l, 'S34', 'Refund processed');
  logAudit('System','Refund processed', l.id + ' ' + l.name, '', inr(amount), `Gateway refund; credit note ${cn}; ref ${ref}`);
  wa(l.id, amount > 0 ? `Refund of ${inr(amount)} started to your original payment method. Credit note ${cn}. Banks usually credit it in 5 to 7 working days.` : `Your refund request was reviewed. Under the refund policy the amount due is ₹0 because services were used. Reply here to raise a grievance.`);
}

/* ================= SLA SWEEP ================= */
function sweep(){
  const t = now();
  for (const r of S.requests) {
    if (r.status === 'In research' && t > r.due && !r.breached) {
      r.breached = true; const l = lead(r.lead);
      if (l && l.moneyBack) { fire('T29', l.id, r.id); logAudit('System','SLA breached', r.id, 'In research', 'Money-back triggered', ''); processRefund(l, Math.round(feeTotal()), r.id + ' money-back'); l.access = true; l.markets = l.markets && l.markets.length ? l.markets : [l.mm, ...MMI[l.mm].near]; setStage(l, 'S14', 'Research continues after money-back'); }
      else { fire('T30', r.lead, r.id); logAudit('System','SLA breached', r.id, 'In research', 'Escalated to Admin', ''); }
    }
    if (r.status === 'In research' && t > r.confirmedAt + 5*DAY && !r.warned) { r.warned = true; fire('T26', r.lead, r.id); }
  }
  // promote waitlist when this week's slots free up
  const wk = weekKey(t);
  const used = S.requests.filter(r => r.slotWeek === wk && r.status !== 'Waitlisted').length;
  let free = S.settings.slotLimit - used;

    for (const p of S.projects.filter(p => p.status === 'Live')) { const [a,b] = P(p.lng,p.lat); if (Math.hypot(a-x,b-y) < 16) return {mm:p.mm, proj:p.id}; }

  }

    else tip.style.display = 'none'; });
  canvas.addEventListener('mouseleave', () => { hov = null; tip.style.display = 'none'; });
  canvas.addEventListener('click', e => { const r = canvas.getBoundingClientRect(), h = hit(e.clientX - r.left, e.clientY - r.top); if (h) { sel = h.mm; onSelect(h.mm, h.proj); } });
  const ro = new ResizeObserver(resize); ro.observe(canvas); resize(); raf = requestAnimationFrame(frame);
  return { select(id){ sel = id; }, heat(v){ heat = v; }, resize, destroy(){ alive = false; cancelAnimationFrame(raf); ro.disconnect(); }, counts };
}

<script>
/* ================= ADMIN ================= */
const ANAV = [['','Dashboard','Dashboard'],['crm','Leads and pipeline','Leads and pipeline'],['projects','Projects and units','Projects'],['markets','Micro-markets','Micro-markets and map'],
 ['requests','Custom requests','Custom requests'],['approvals','Approvals','Approvals'],['automation','Triggers and automation','Triggers and templates'],

function visibleLeads(){ return S.role === 'Sales executive' ? S.leads.filter(l => l.owner === 'Rahul') : S.leads; }

  <div class="kpis">
   <div class="kpi"><span>Leads</span><b class="num">${L.length}</b></div><div class="kpi"><span>Paid customers</span><b class="num">${paid.length}</b></div>
   <div class="kpi"><span>Fee revenue, net of refunds, excl. GST</span><b class="num">${inr(fee)}</b></div><div class="kpi"><span>Visits scheduled or done</span><b class="num">${visits}</b></div>
   <div class="kpi"><span>Bookings</span><b class="num">${books}</b></div><div class="kpi"><span>Approvals waiting</span><b class="num">${S.approvals.filter(a=>a.status==='Pending').length}</b></div></div>
  <div class="grid2">
   <div class="box"><h3>Where leads are now</h3>${colCounts.map(([n,c]) => `<div style="display:grid; grid-template-columns:90px 1fr 28px; gap:10px; align-items:center; margin:6px 0; font-size:13px"><span class="muted">${n}</span><span style="height:10px; background:var(--spice); opacity:.85; border-radius:3px; width:${c/mx*100}%"></span><span class="num">${c}</span></div>`).join('')}</div>
   <div class="box"><h3>Research deadlines</h3><p class="muted" style="font-size:13px">This week: ${slotsUsed()} of ${S.settings.slotLimit} slots used · ${S.requests.filter(r=>r.status==='Waitlisted').length} waitlisted</p>
    <table class="tbl"><tbody>${sla.map(r => { const left = r.due - now(); return `<tr><td>${esc(r.id)}</td><td>${esc(lead(r.lead).name)}</td><td class="num"><span class="status ${left<0?'no':left<2*DAY?'wait':'ok'}">${left<0?'Late':Math.floor(left/DAY)+' d '+Math.floor(left%DAY/36e5)+' h'}</span></td></tr>`; }).join('') || '<tr><td class="muted">Nothing in research.</td></tr>'}</tbody></table></div>
   <div class="box" style="grid-column:1/-1"><h3>Automation, last 10 runs</h3><div class="scroll"><table class="tbl"><thead><tr><th>When</th><th>Trigger</th><th>Lead</th><th>Actions</th></tr></thead><tbody>
    ${S.autolog.slice(0,10).map(a => `<tr><td class="num">${fdt(a.ts)}</td><td>${a.tid} ${esc(a.name)}</td><td>${a.lead ? esc((lead(a.lead)||{}).name||a.lead) : ''}</td><td class="muted">${esc(a.actions)}</td></tr>`).join('') || '<tr><td class="muted" colspan="4">No runs yet. Walk through the customer journey to see triggers fire.</td></tr>'}</tbody></table></div></div>
  </div>`;
}
function aCrm(){
  const L = visibleLeads();
  return `<div class="pagehead"><div><h2>Leads and pipeline</h2><p class="muted" style="margin:4px 0 0">${S.role==='Sales executive'?'Showing your leads (Rahul).':'All leads.'} Stages marked external are what the customer sees.</p></div></div>

}
function leadDrawer(id){
  const l = lead(id), ed = canEdit('Leads and pipeline');
  const hist = S.audit.filter(a => a.entity.startsWith(id)).slice(-12).reverse(), auto = S.autolog.filter(a => a.lead === id).slice(0,8);
  const opts = Object.entries(STAGES).map(([k,v]) => `<option value="${k}" ${k===l.stage?'selected':''}>${k} ${esc(v[0])}${v[1]==='E'?' (customer sees)':''}</option>`).join('');
  const n = +l.stage.slice(1);
  drawer(`<button class="btn ghost small" onclick="closeDrawer()" style="float:right">Close</button><h3>${esc(l.name)}</h3>
   <div class="muted" style="font-size:13px">${esc(l.id)} · ${esc(l.phone)} · ${esc(l.src)} · owner ${esc(l.owner)}${l.lang?' · '+esc(l.lang):''}</div>
   <dl class="kv"><dt>Market</dt><dd>${esc(MMI[l.mm].name)}</dd><dt>Paid</dt><dd>${l.paidAt ? fd(l.paidAt) + (l.moneyBack ? ', money-back add-on' : '') : 'No'}</dd>
   <dt>Consent</dt><dd>${l.consent ? `WhatsApp ${l.consent.wa?'yes':'no'}, calls ${l.consent.call?'yes':'no'}, developer ${l.consent.dev?'yes':'no'}` : 'Recorded at source (seed data)'}</dd>
   <dt>Collected</dt><dd>${l.collected!=null ? Math.round(l.collected*100) + '% of target ' + Math.round((l.target||0)*100) + '%' : 'None'}</dd></dl>
   <label class="f">Stage<select id="stSel" ${ed?'':'disabled'}>${opts}</select></label>
   <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px">
    <button class="btn small" ${ed?'':'disabled'} onclick="setStage(lead('${id}'), $('#stSel').value, 'Manual'); save(); leadDrawer('${id}'); route()">Save stage</button>
    ${n>=17&&n<19?`<button class="btn ghost small" ${ed?'':'disabled'} onclick="visitDone('${id}')">Mark visit done</button>`:''}
    ${n===24?`<button class="btn ghost small" ${ed?'':'disabled'} onclick="bookingPaid('${id}')">Developer confirms booking amount</button>`:''}
    ${n>=25&&n<=29&&!l.agreementAt?`<button class="btn ghost small" ${ed?'':'disabled'} onclick="agreement('${id}')">Record agreement registration</button>`:''}
   </div>
   ${n>=25&&n<=29?`<div class="box" style="padding:14px; margin-bottom:14px"><b>Record a milestone payment</b> <span class="faint" style="font-size:12.5px">(paid to developer's RERA account)</span>
    <div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:8px">${[0.10,0.15,0.20,0.25,0.30].map(p => `<button class="btn ghost small" ${ed?'':'disabled'} onclick="milestone('${id}',${p})">${p*100}%</button>`).join('')}</div>
    <label class="f" style="margin-top:10px">Target collection for this deal<select ${ed?'':'disabled'} onchange="lead('${id}').target=+this.value; logAudit(actor(),'Target set','${id}','',this.value,''); save()">${[0.10,0.15,0.20,0.25,0.30].map(p => `<option value="${p}" ${Math.abs((l.target||0.1)-p)<.001?'selected':''}>${p*100}%</option>`).join('')}</select></label>
    <p class="faint" style="font-size:12.5px; margin:0">${law('RERA s.13','Above 10% is blocked until the agreement for sale is registered.')}</p></div>`:''}
   <label class="f">Add a note<textarea id="note" rows="2" ${ed?'':'disabled'}></textarea></label><button class="btn ghost small" ${ed?'':'disabled'} onclick="addNote('${id}')">Save note</button>
   ${(l.notes||[]).map(x => `<p style="font-size:13px; margin-top:8px"><span class="faint">${fdt(x.ts)} ${esc(x.by)}:</span> ${esc(x.t)}</p>`).join('')}
   <h3 style="margin-top:22px">History</h3><div class="timeline">${[...auto.map(a => [a.ts, `${a.tid} ${a.name}: ${a.actions}`]), ...hist.map(a => [a.ts, `${a.action}: ${a.before?a.before+' to ':''}${a.after} (${a.who})`])].sort((a,b)=>b[0]-a[0]).map(x => `<div><span class="faint">${fdt(x[0])}</span><br>${esc(x[1])}</div>`).join('') || '<div class="muted">No history yet.</div>'}</div>`);
}
function addNote(id){ const l = lead(id), t = $('#note').value.trim(); if (!t) return; l.notes = l.notes || []; l.notes.unshift({ts:now(), by:S.role, t}); logAudit(S.role,'Note added', id, '', t, ''); save(); leadDrawer(id); }
function visitDone(id){ const l = lead(id); setStage(l, 'S19', 'Visit completed'); fire('T37', id); wa(id, 'Thank you for visiting. Please rate your visit; it takes 20 seconds.'); save(); leadDrawer(id); route(); }
function bookingPaid(id){ const l = lead(id); fire('T45', id); setStage(l, 'S25', 'Booking amount confirmed'); l.collected = 0.10; l.target = l.target || 0.10; if (l.hold) { const u = findUnit(l.hold.unit); if (u) u.status = 'Booked'; l.hold = null; }
  wa(id, 'The developer confirmed your booking amount. Your unit is booked.'); checkTarget(l); save(); leadDrawer(id); route(); }
function agreement(id){ const l = lead(id); l.agreementAt = now(); fire('T49', id); setStage(l, 'S28', 'Agreement registered'); logAudit(actor(),'Agreement registration recorded', id, '', fd(l.agreementAt), 'Unlocks milestones above 10%'); save(); leadDrawer(id); route(); }
function milestone(id, p){
  const l = lead(id);
  if (p > 0.10 && !l.agreementAt) { fire('T46', id); logAudit('System','Blocked', id, '', 'Collection ' + p*100 + '%', 'RERA s.13: no registered agreement for sale'); save(); toast('Blocked: above 10% needs a registered agreement for sale (RERA s.13).'); leadDrawer(id); return; }
  const b = l.collected || 0; l.collected = Math.max(b, p); logAudit(actor(),'Milestone recorded', id, Math.round(b*100)+'%', Math.round(l.collected*100)+'%', 'Paid to developer RERA account');
  if (+l.stage.slice(1) >= 28) setStage(l, 'S29', 'Collection in progress'); checkTarget(l); save(); leadDrawer(id); route();
}
function checkTarget(l){ if (l.target && (l.collected||0) >= l.target - 1e-9 && +l.stage.slice(1) < 30) { setStage(l, 'S30', 'Target reached'); fire('T52', l.id);
  const p = proj('P001'), u = p.units[0], gap = (u.psf - (p.devNet || 10000)) * u.carpet / 1.18; requestApproval('W09', 'commission', 'Price gap invoice to ' + (p.payer || 'Investor').toLowerCase() + ': ' + l.name, `(${inr(u.psf)} listed − ${inr(p.devNet || 10000)} investor price) × ${u.carpet} sq ft ÷ 1.18 (case B) = ${inr(gap)} + GST. Case A would be ${inr(gap * 1.18)}.`, {lead:l.id, amount:gap, payer:p.payer}); wa(l.id, 'Congratulations, your booking is complete.'); } }

/* ---------- projects ---------- */
function aProjects(){
  const ed = canEdit('Projects');
  return `<div class="pagehead"><div><h2>Projects and units</h2><p class="muted" style="margin:4px 0 0">Every change goes to approval and the audit trail. ${law('RERA s.3','A project without a K-RERA number cannot be published.')}</p></div>
   <div style="display:flex; gap:8px; flex-wrap:wrap"><label class="btn ghost small" style="${ed?'':'opacity:.45;pointer-events:none'}">Import Excel<input type="file" id="xl" accept=".xlsx,.xls" hidden></label><button class="btn small" ${ro('Projects')} onclick="newProject()">New project</button></div></div>
  <div id="importOut"></div>
  ${S.projects.map(p => `<div class="box" style="margin-bottom:20px"><div class="pagehead" style="margin-bottom:10px"><div><h3>${esc(p.name)}</h3><div class="faint" style="font-size:13px">${esc(p.id)} · ${esc(MMI[p.mm].name)} · ${esc(p.rera)}</div></div>
   <label class="f" style="margin:0; min-width:180px">Map visibility<select ${ro('Micro-markets and map')} onchange="mapStatus('${p.id}', this.value)">${['Live','Dimmed','Hidden'].map(s => `<option ${s===p.status?'selected':''}>${s}</option>`).join('')}</select></label></div>
   <div class="scroll"><table class="tbl"><thead><tr><th>Unit</th><th>Type</th><th>Carpet</th><th>Per sq ft</th><th>All-in</th><th>Status</th></tr></thead><tbody>
   ${p.units.map(u => `<tr><td>${esc(u.no)}</td><td>${esc(u.cfg)}</td><td class="num">${u.carpet}</td><td class="num">${inr(u.psf)}</td><td class="num">${lakh(unitTotal(u))}</td><td>${esc(u.status)}</td></tr>`).join('')}</tbody></table></div>
   <div style="display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; margin-top:12px"><label class="f" style="margin:0">Change price for<select id="pc_${p.id}">${[...new Set(p.units.map(u=>u.cfg))].map(c=>`<option>${c}</option>`).join('')}</select></label>
   <label class="f" style="margin:0">New price per carpet sq ft<input id="pp_${p.id}" type="number" step="10" style="width:140px"></label><button class="btn ghost small" ${ro('Units and pricing')} onclick="priceChange('${p.id}')">Send for approval</button>
   <span class="faint" style="font-size:12.5px">${law('Fixed price','Applies to all buyers; no discounts. Shortlisters are notified.')}</span></div></div>`).join('')}`;
}
function mapStatus(pid, v){ const p = proj(pid); requestApproval('W04', 'mapstatus', `Map visibility: ${p.name}`, `${p.status} to ${v}`, {project:pid, status:v}); fire('T66'); save(); toast('Sent for approval.'); route(); }
function priceChange(pid){ const p = proj(pid), cfg = $('#pc_'+pid).value, v = +$('#pp_'+pid).value; if (!v) { toast('Enter the new price.'); return; }
  const cur = p.units.find(u => u.cfg === cfg).psf; requestApproval('W02', 'price', `Price change: ${p.name}, ${cfg}`, `${inr(cur)} to ${inr(v)} per carpet sq ft, all ${cfg} units`, {project:pid, cfg, psf:v}); fire('T66'); save(); toast('Sent for approval.'); route(); }
function newProject(){
  modal(`<h3>New project</h3><p class="muted" style="margin-top:4px; font-size:13.5px">For many projects at once, use Import Excel with the data template.</p>
  <label class="f" style="margin-top:12px">Project name<input id="np_n"></label><label class="f">Developer<input id="np_d"></label>
  <label class="f">Micro-market<select id="np_m">${MM.map(m => `<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select></label>
  <label class="f">K-RERA registration number (required)<input id="np_r"></label><label class="f">Possession<input id="np_p" placeholder="e.g. December 2028"></label>
  <button class="btn small" onclick="saveProject()">Send for approval</button> <button class="btn ghost small" onclick="closeModal()">Cancel</button>`);
}
function saveProject(){
  const r = $('#np_r').value.trim(), n = $('#np_n').value.trim(); if (!n) { toast('Add a project name.'); return; }
  if (!r) { toast('A K-RERA registration number is required (RERA s.3).'); return; }
  const m = MMI[$('#np_m').value], id = 'P' + String(S.projects.length + 1).padStart(3,'0');
  const p = {id, name:n, dev:$('#np_d').value, mm:m.id, rera:r, reraValid:'', possession:$('#np_p').value, status:'Dimmed', towers:0, total:0, withUs:0, configs:'', carpet:'', amen:'', lat:m.lat+0.004, lng:m.lng-0.004, units:[], commission:0.02};
  requestApproval('W01', 'project', 'New project: ' + n, `${m.name}; K-RERA ${r}; starts dimmed on the map`, {project:p}); fire('T66'); closeModal(); save(); toast('Sent for approval.'); route();
}
function wireImport(){
  const inp = $('#xl'); if (!inp) return;
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    if (typeof XLSX === 'undefined') { $('#importOut').innerHTML = '<div class="lawnote">The Excel reader did not load. Check the connection and try again.</div>'; return; }
    try {
      const wb = XLSX.read(await f.arrayBuffer(), {cellDates:true});
      const rows = n => wb.Sheets[n] ? XLSX.utils.sheet_to_json(wb.Sheets[n], {header:1, defval:''}) : null;
      const pr = rows('Projects'), ur = rows('Units'), mr = rows('Micro_Markets'), nr = rows('Nearby_Mapping');
      if (!pr || !ur) throw new Error('This is not the Arrakis Realty data template: sheets Projects and Units are missing.');
      const errs = [], projects = [], units = [], mms = [];
      const d = v => v instanceof Date ? v.toISOString().slice(0,10) : String(v || '');
      pr.slice(1).forEach((r, i) => { if (!r[0]) return; const row = i + 2;
        if (!String(r[8]).trim()) { errs.push(`Projects row ${row}: K-RERA number missing, row skipped.`); return; }
        if (!MMI[r[3]]) { errs.push(`Projects row ${row}: unknown micro-market "${r[3]}", row skipped.`); return; }
        const m = MMI[r[3]];
        projects.push({id:String(r[0]), name:String(r[1]), dev:String(r[2]), mm:r[3], rera:String(r[8]), reraValid:d(r[9]), possession:d(r[11]) || String(r[10]), status:['Live','Dimmed','Hidden'].includes(r[19]) ? r[19] : 'Dimmed',
          towers:+r[13]||0, total:+r[14]||0, withUs:+r[15]||0, configs:String(r[16]), carpet:String(r[17]), amen:String(r[18]), lat:+r[6]||m.lat, lng:+r[7]||m.lng, commission:+r[23]||0.02, units:[]}); });
      const pids = new Set([...projects.map(p => p.id), ...S.projects.map(p => p.id)]);
      ur.slice(1).forEach((r, i) => { if (!r[0]) return; const row = i + 2;
        if (!pids.has(String(r[1]))) { errs.push(`Units row ${row}: project "${r[1]}" not found, row skipped.`); return; }
        if (!(+r[7] > 0) || !(+r[8] > 0)) { errs.push(`Units row ${row}: carpet area or price missing, row skipped.`); return; }
        units.push({id:String(r[0]), project:String(r[1]), tower:String(r[2]), floor:+r[3]||0, no:String(r[4]), cfg:String(r[5]), face:String(r[6]), carpet:+r[7], psf:+r[8], park:+r[10]||0, other:+r[11]||0, gst:+r[12]||0, investor:String(r[20]), status:String(r[23]||'Available')}); });
      if (mr) mr.slice(1).forEach(r => { if (MMI[r[0]]) { const med = +r[11] || +r[9]; if (med) mms.push({id:r[0], median:med}); } });
      if (nr) nr.slice(1).forEach(r => { if (MMI[r[0]]) { const fin = r.slice(17,22).filter(x => MMI[x]); if (fin.length === 5) { const e = mms.find(x => x.id === r[0]); e ? e.nearby = fin : mms.push({id:r[0], nearby:fin}); } } });
      window._imp = {projects, units, mms, file:f.name};
      $('#importOut').innerHTML = `<div class="box key" style="margin-bottom:20px"><h3>Ready to import ${esc(f.name)}</h3><p>${projects.length} projects, ${units.length} units, ${mms.length} micro-market updates.</p>
       ${errs.length ? `<div class="lawnote">${errs.slice(0,12).map(esc).join('<br>')}${errs.length>12?`<br>and ${errs.length-12} more`:''}</div>` : '<p class="muted">No problems found.</p>'}
       <button class="btn small" onclick="submitImport()">Send for approval</button></div>`;
    } catch(e) { $('#importOut').innerHTML = `<div class="lawnote">${esc(e.message)}</div>`; }
    inp.value = '';
  };
}
function submitImport(){ const p = window._imp; requestApproval('W01', 'import', 'Excel import: ' + p.file, `${p.projects.length} projects, ${p.units.length} units, ${p.mms.length} market updates`, p); fire('T66'); save(); toast('Import sent for approval.'); route(); }
function applyImport(p){
  p.projects.forEach(np => { const ex = proj(np.id); if (ex) { const u = ex.units; Object.assign(ex, np); ex.units = u; } else S.projects.push(np); });
  p.units.forEach(u => { const pr = proj(u.project); const i = pr.units.findIndex(x => x.id === u.id); const nu = {...u}; delete nu.project; if (i >= 0) pr.units[i] = nu; else pr.units.push(nu); });
  S.projects.forEach(pr => pr.withUs = pr.units.length || pr.withUs);
  p.mms.forEach(m => { if (m.median) MMI[m.id].median = m.median; if (m.nearby) MMI[m.id].near = m.nearby; });
  S.mmOverrides = Object.fromEntries(MM.map(m => [m.id, {median:m.median, near:m.near}]));
  logAudit('System','Import applied', p.file, '', `${p.projects.length} projects, ${p.units.length} units`, '');
}
/* ---------- micro-markets ---------- */
function aMarkets(){
  const ed = canEdit('Micro-markets and map');
  return `<div class="pagehead"><div><h2>Micro-markets and nearby mapping</h2><p class="muted" style="margin:4px 0 0">Suggested nearby markets are the ${S.settings.nearbyCount} closest by straight-line distance. Change any of them here or in the Excel template. Source: BBMP wards (KGIS, via DataMeet, ODbL); points approximate.</p></div></div>
  <div class="box scroll"><table class="tbl"><thead><tr><th>ID</th><th>Market</th><th>Zone</th><th>BBMP ward</th><th>Median per sq ft</th>${[1,2,3,4,5].map(i=>`<th>Nearby ${i}</th>`).join('')}</tr></thead><tbody>
  ${MM.map(m => `<tr><td>${m.id}</td><td>${esc(m.name)}</td><td>${esc(m.zone)}</td><td class="muted">${esc(m.ward)}</td><td class="num">${medianFor(m.id) ? inr(medianFor(m.id)) : '<span class="faint">Add via Excel</span>'}</td>
   ${m.near.slice(0,5).map((x,i) => `<td><select ${ed?'':'disabled'} onchange="setNear('${m.id}',${i},this.value)" style="background:var(--night-2); border:1px solid var(--line); border-radius:6px; padding:3px">${MM.filter(o=>o.id!==m.id).map(o => `<option value="${o.id}" ${o.id===x?'selected':''}>${esc(o.name)}</option>`).join('')}</select></td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function setNear(id, i, v){ const m = MMI[id], b = m.near[i]; m.near[i] = v; S.mmOverrides = Object.fromEntries(MM.map(x => [x.id, {median:x.median, near:x.near}])); logAudit(actor(),'Nearby mapping changed', id + ' slot ' + (i+1), MMI[b].name, MMI[v].name, 'Manual mapping'); save(); toast('Saved and logged.'); }
/* ---------- requests ---------- */
function aRequests(){
  const ed = canEdit('Custom requests');
  return `<div class="pagehead"><div><h2>Custom requests</h2><p class="muted" style="margin:4px 0 0">This week: ${slotsUsed()} of ${S.settings.slotLimit} slots used. The 7-day clock starts at slot confirmation.</p></div><button class="btn ghost small" onclick="skipDay()">Prototype: move time 1 day</button></div>
  <div class="box scroll"><table class="tbl"><thead><tr><th>ID</th><th>Customer</th><th>Request</th><th>K-RERA status</th><th>Status</th><th>Time left</th><th></th></tr></thead><tbody>
  ${S.requests.map(r => { const left = r.due ? r.due - now() : null, l = lead(r.lead); return `<tr><td>${r.id}</td><td>${esc(l.name)}${l.moneyBack?' <span class="status spice">money-back</span>':''}</td><td>${esc(r.text)}</td>
   <td><select ${ed?'':'disabled'} onchange="reraCheck('${r.id}', this.value)" style="background:var(--night-2); border:1px solid var(--line); border-radius:6px; padding:3px">${['To be checked','Unknown','Yes','No'].map(s=>`<option ${s===r.rera?'selected':''}>${s}</option>`).join('')}</select></td>
   <td><span class="status ${r.status==='Delivered'?'ok':r.status==='Waitlisted'?'wait':'spice'}">${esc(r.status)}${r.pending?' · awaiting approval':''}</span></td>
   <td class="num">${r.status==='In research' ? (left<0?'<span class="status no">Late</span>':Math.floor(left/DAY)+' d '+Math.floor(left%DAY/36e5)+' h') : ''}</td>
   <td>${r.status==='In research' && !r.pending ? `<button class="btn ghost small" ${ed?'':'disabled'} onclick="submitResearch('${r.id}')">Submit report</button>` : ''}</td></tr>`; }).join('')}</tbody></table></div>`;
}
function reraCheck(id, v){ const r = S.requests.find(x => x.id === id); const b = r.rera; r.rera = v; logAudit(actor(),'K-RERA check', id, b, v, ''); if (v === 'No') { fire('T31', r.lead, id); toast('Marked not registered: the report will carry facts only, no promotion (RERA s.10).'); } save(); }
function submitResearch(id){ modal(`<h3>Submit report ${id}</h3><label class="f" style="margin-top:12px">Validated findings<textarea id="rep" rows="6">Developer, K-RERA status, configurations, price per carpet sq ft with sources, possession timeline, risks.</textarea></label><button class="btn small" onclick="doSubmitResearch('${id}')">Send for validation</button>`); }
function doSubmitResearch(id){ const r = S.requests.find(x => x.id === id); r.pending = true; const rep = $('#rep').value + (r.rera === 'No' ? ' [Facts only: project not K-RERA registered; not promoted.]' : '');
  requestApproval('W05', 'research', 'Research validation: ' + id, r.text, {req:id, report:rep}); fire('T27', r.lead, id); closeModal(); save(); route(); }
/* ---------- approvals ---------- */
function aApprovals(){
  const pend = S.approvals.filter(a => a.status === 'Pending'), done = S.approvals.filter(a => a.status !== 'Pending');
  return `<div class="pagehead"><div><h2>Approvals</h2><p class="muted" style="margin:4px 0 0">Approver per workflow is set in Roles and approvers. ${S.settings.selfApprove?'Admin may approve own changes with a reason; these are flagged in the audit trail.':'Self-approval is off.'}</p></div></div>
  ${pend.map(a => `<div class="box key" style="margin-bottom:14px"><div style="display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap"><div><b>${esc(a.title)}</b><div class="faint" style="font-size:12.5px">${a.id} · ${a.wf} · requested by ${esc(a.maker)} · ${fdt(a.created)} · approver: ${esc(S.wf[a.wf]||'Admin')}</div></div></div>
   <p style="margin:8px 0">${esc(a.detail)}</p>${a.kind==='refund'?`<label class="f" style="max-width:220px">Refund amount (INR)<input id="amt_${a.id}" type="number" value="${a.payload.amount}"></label>`:''}
   <label class="f">Reason (required for rejection or self-approval)<input id="rs_${a.id}"></label>
   <button class="btn small" onclick="approve('${a.id}',true)">Approve</button> <button class="btn danger small" onclick="approve('${a.id}',false)">Reject</button></div>`).join('') || '<div class="box"><p class="muted" style="margin:0">Nothing is waiting for approval.</p></div>'}
  <h3 style="margin:26px 0 10px">Decided</h3><div class="box scroll"><table class="tbl"><thead><tr><th>ID</th><th>Request</th><th>Maker</th><th>Decision</th><th>By</th><th>When</th><th>Reason</th></tr></thead><tbody>
  ${done.map(a => `<tr><td>${a.id}</td><td>${esc(a.title)}</td><td>${esc(a.maker)}</td><td><span class="status ${a.status==='Approved'?'ok':'no'}">${a.status}</span></td><td>${esc(a.decidedBy)}</td><td class="num">${fdt(a.decidedAt)}</td><td class="muted">${esc(a.reason)}</td></tr>`).join('') || '<tr><td class="muted" colspan="7">None yet.</td></tr>'}</tbody></table></div>`;
}
function approve(id, ok){ const a = S.approvals.find(x => x.id === id), rs = $('#rs_'+id).value.trim();
  if (!ok && !rs) { toast('Give a reason for rejecting.'); return; }
  if (a.kind === 'refund') { const v = +$('#amt_'+id).value; if (v !== a.payload.amount) { if (!rs) { toast('Changing the refund amount needs a reason.'); return; } logAudit(S.role,'Refund amount changed', a.id, inr(a.payload.amount), inr(v), rs); a.payload.amount = v; } }
  if (!ok && a.kind === 'research') { const r = S.requests.find(x => x.id === a.payload.req); r.pending = false; }
  if (!ok && a.kind === 'refund') { const l = lead(a.payload.lead); setStage(l, 'S11', 'Refund rejected'); wa(l.id, 'Your refund request was reviewed and not approved: ' + rs + '. You can raise a grievance from your dashboard.'); }
  decide(id, ok, rs); if (ok && a.kind === 'research') { const r = S.requests.find(x => x.id === a.payload.req); r.pending = false; } save(); route(); }
/* ---------- automation ---------- */
function aAuto(){
  const ed = canEdit('Triggers and templates');
  return `<div class="pagehead"><div><h2>Triggers and automation</h2><p class="muted" style="margin:4px 0 0">${TRIGGERS.length} of the 70 triggers in the configuration workbook are wired in this prototype. Switching one goes to approval.</p></div></div>
  <div class="box scroll"><table class="tbl"><thead><tr><th>On</th><th>ID</th><th>Trigger</th><th>Actions</th><th>Compliance</th></tr></thead><tbody>
  ${TRIGGERS.map(t => `<tr><td><label class="toggle"><input type="checkbox" ${S.trig[t[0]]?'checked':''} ${ed?'':'disabled'} onchange="trigToggle('${t[0]}', this.checked)" aria-label="${esc(t[1])}"><span></span></label></td><td>${t[0]}</td><td>${esc(t[1])}</td><td class="muted">${esc(t[2])}</td><td>${t[3]?law(t[3], t[3]):''}</td></tr>`).join('')}</tbody></table></div>
  <h3 style="margin:26px 0 10px">Run log</h3><div class="box scroll"><table class="tbl"><thead><tr><th>When</th><th>Trigger</th><th>Lead</th><th>Actions</th></tr></thead><tbody>
  ${S.autolog.slice(0,60).map(a => `<tr><td class="num">${fdt(a.ts)}</td><td>${a.tid} ${esc(a.name)}</td><td>${a.lead ? esc((lead(a.lead)||{}).name||a.lead) : ''}</td><td class="muted">${esc(a.actions)}</td></tr>`).join('') || '<tr><td class="muted" colspan="4">No runs yet.</td></tr>'}</tbody></table></div>`;
}
function trigToggle(tid, on){ const t = TRIGGERS.find(x => x[0] === tid); requestApproval('W13', 'trig', `${on?'Switch on':'Switch off'} ${tid} ${t[1]}`, t[3] ? 'Compliance-linked trigger: ' + t[3] : 'Automation change', {tid, on}); save(); toast('Sent for approval.'); route(); }
/* ---------- roles ---------- */
function aRoles(){
  const ed = canEdit('Users and roles'), order = 'FAEVON';
  return `<div class="pagehead"><div><h2>Roles and approvers</h2><p class="muted" style="margin:4px 0 0">Click a cell to request a change. F full, A approve, E edit through approval, V view, O own records, N none.</p></div></div>
  <div class="box scroll"><table class="tbl perm"><thead><tr><th>Module</th>${ROLES.map(r=>`<th>${esc(r)}</th>`).join('')}</tr></thead><tbody>
  ${MODULES.map((m,i) => `<tr><td>${esc(m)}</td>${ROLES.map(r => { const c = S.perm[r][i]; return `<td class="${c}" ${ed?`onclick="permChange('${r}',${i})"`:''} title="${esc(r)}: ${esc(m)}">${c}</td>`; }).join('')}</tr>`).join('')}</tbody></table></div>
  <h3 style="margin:26px 0 10px">Approver for each workflow</h3><div class="box scroll"><table class="tbl"><thead><tr><th>ID</th><th>Workflow</th><th>Approver role</th></tr></thead><tbody>
  ${WORKFLOWS.map(w => `<tr><td>${w[0]}</td><td>${esc(w[1])}</td><td><select ${ed?'':'disabled'} onchange="wfChange('${w[0]}', this.value)" style="background:var(--night-2); border:1px solid var(--line); border-radius:6px; padding:4px">${ROLES.filter(r=>r!=='Customer').map(r => `<option ${r===S.wf[w[0]]?'selected':''}>${r}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div>`;
}
function permChange(r, i){ const order = 'FAEVON', c = S.perm[r][i], n = order[(order.indexOf(c)+1) % order.length];
  requestApproval('W10', 'role', `Permission: ${r} / ${MODULES[i]}`, `${c} to ${n}`, {role:r, idx:i, code:n, before:c}); fire('T67'); save(); toast(`Requested ${r} / ${MODULES[i]}: ${c} to ${n}. Sent for approval.`); route(); }
function wfChange(w, r){ requestApproval('W10', 'wf', `Approver for ${w}`, `${S.wf[w]} to ${r}`, {wf:w, role:r}); fire('T67'); save(); toast('Sent for approval.'); route(); }
/* ---------- settings ---------- */
function aSettings(){
  const s = S.settings, ed = canEdit('Settings');
  const f = (k, lbl, note) => `<label class="f">${lbl}<input type="number" id="s_${k}" value="${s[k]}" ${ed?'':'disabled'}>${note?`<span class="faint" style="font-size:12px">${note}</span>`:''}</label>`;
  return `<div class="pagehead"><div><h2>Settings</h2><p class="muted" style="margin:4px 0 0">Changes go to approval. Fee changes also need updated policy pages.</p></div></div>
  <div class="grid2"><div class="box"><h3>Package</h3>${f('fee','Subscription launch price, INR excl. GST','Shown to customers with 18% GST added')}${f('standardPrice','Standard price, INR excl. GST','Show only if it is a genuine price; lawyer to confirm')}${f('accessDays','Access period, days','Ends earlier if the customer buys')}${f('addon','Money-back add-on, INR excl. GST')}${f('nearbyCount','Nearby markets included')}${f('requestLimit','Custom reports per customer')}${f('slotLimit','Research slots per week (all customers)')}</div>
  <div class="box"><h3>Rules</h3>${f('refundDays','Refund window, days')}${f('reportDeduction','Refund deduction per delivered report, INR excl. GST','Placeholder; your decision')}${f('holdHours','Unit hold, hours')}${f('rideCost','Typical luxury ride cost, INR','Used in refund calculation')}
   <label class="check"><input type="checkbox" id="s_showStandard" ${s.showStandard?'checked':''} ${ed?'':'disabled'}> <span>Show the standard price next to the launch price</span></label>
   <label class="check"><input type="checkbox" id="s_selfApprove" ${s.selfApprove?'checked':''} ${ed?'':'disabled'}> <span>Admin may approve own changes (with a reason; flagged in audit)</span></label></div></div>
  <button class="btn" style="margin-top:16px" ${ed?'':'disabled'} onclick="saveSettings()">Send for approval</button>
  <div class="box" style="margin-top:24px"><h3>Prototype data</h3><p class="muted">Clears everything in this browser and reloads the sample data.</p><button class="btn danger small" onclick="if(confirm('Reset all prototype data in this browser?')){try{localStorage.removeItem(KEY)}catch(e){} location.hash='#/'; location.reload();}">Reset prototype</button></div>`;
}
function saveSettings(){ const ch = {}; for (const k in S.settings) { const el = $('#s_'+k); if (!el) continue; const v = el.type === 'checkbox' ? el.checked : +el.value; if (v !== S.settings[k]) ch[k] = v; }
  if (!Object.keys(ch).length) { toast('No changes.'); return; } requestApproval('W12', 'settings', 'Settings change', Object.entries(ch).map(([k,v]) => `${k}: ${S.settings[k]} to ${v}`).join('; '), ch); save(); toast('Sent for approval.'); route(); }
function aFeatures(){
  const ed = canEdit('Settings');
  return `<div class="pagehead"><div><h2>CRM features</h2><p class="muted" style="margin:4px 0 0">Switch modules on as you need them. ${S.feat.filter(Boolean).length} of ${CRMF.length} on. Full list with Zoho and Salesforce equivalents is in the configuration workbook.</p></div></div>
  <div class="box scroll"><table class="tbl"><thead><tr><th>On</th><th>Module</th><th>Feature</th></tr></thead><tbody>
  ${CRMF.map((c,i) => `<tr><td><label class="toggle"><input type="checkbox" ${S.feat[i]?'checked':''} ${ed?'':'disabled'} onchange="S.feat[${i}]=this.checked; logAudit(actor(),'Feature switched','${esc(c[1])}','',this.checked,''); save()" aria-label="${esc(c[1])}"><span></span></label></td><td class="muted">${esc(c[0])}</td><td>${esc(c[1])}</td></tr>`).join('')}</tbody></table></div>`;
}
/* ---------- audit ---------- */
function aAudit(){
  return `<div class="pagehead"><div><h2>Audit trail</h2><p class="muted" style="margin:4px 0 0">Every entry is chained to the one before it, so any edit to history breaks the chain. In production the chain is also archived to write-once storage for 8 years.</p></div>
   <div style="display:flex; gap:8px"><button class="btn ghost small" onclick="const b=verifyChain(); toast(b?'Chain broken at entry '+b:'Chain verified: '+S.audit.length+' entries intact.')">Verify chain</button><button class="btn ghost small" onclick="copyCsv()">Copy as CSV</button></div></div>
  <div class="box scroll"><table class="tbl"><thead><tr><th>#</th><th>When</th><th>Who</th><th>Action</th><th>Record</th><th>Before</th><th>After</th><th>Reason</th><th>Hash</th></tr></thead><tbody>
  ${S.audit.slice().reverse().slice(0,300).map(e => `<tr><td class="num">${e.id}</td><td class="num">${fdt(e.ts)}</td><td>${esc(e.who)}</td><td>${esc(e.action)}</td><td>${esc(e.entity)}</td><td class="muted">${esc(e.before)}</td><td>${esc(e.after)}</td><td class="muted">${e.reason.startsWith('[SELF')?'<span class="status wait">self-approval</span> ':''}${esc(e.reason.replace('[SELF-APPROVAL] ',''))}</td><td class="hash">${e.hash}</td></tr>`).join('')}</tbody></table></div>`;
}
function copyCsv(){ const q = v => '"' + String(v).replace(/"/g,'""') + '"'; const csv = ['id,time,who,action,record,before,after,reason,prev,hash', ...S.audit.map(e => [e.id, new Date(e.ts).toISOString(), e.who, e.action, e.entity, e.before, e.after, e.reason, e.prev, e.hash].map(q).join(','))].join('\n');
  (navigator.clipboard ? navigator.clipboard.writeText(csv) : Promise.reject()).then(() => toast('Copied ' + S.audit.length + ' entries.'), () => modal(`<h3>Audit CSV</h3><textarea rows="12" style="width:100%; background:var(--night); color:var(--ink); font-size:11px">${esc(csv)}</textarea>`)); }

/* ================= ROUTER ================= */
function openReport(id){ const r = S.requests.find(x => x.id === id); modal(`<h3>Research report</h3><p style="margin-top:10px">${esc(r.report)}</p><button class="btn small" onclick="closeModal()">Close</button>`); }
function nav(){
  const h = location.hash;
  const items = S.role === 'Customer' ? [] : [['#/','Customer view'],['#/admin','Admin']];
  $('#nav').innerHTML = items.map(([u,t]) => `<a href="${u}" class="${(u==='#/'?!h.startsWith('#/admin'):h.startsWith(u))?'on':''}">${t}</a>`).join('');
}
function route(){
  sweep();
  const raw = location.hash.replace(/^#/, '') || '/', [path] = raw.split('?'), parts = path.split('/').filter(Boolean);
  $('#role').value = S.role; nav();
  if (parts[0] === 'admin') {
    if (S.role === 'Customer') { location.hash = '#/'; return; }
    if (mapCtl) { mapCtl.destroy(); mapCtl = null; }
    const y = window.scrollY, same = route.last === path; route.last = path;
    viewAdmin(parts[1] || '', parts[2]); window.scrollTo(0, same ? y : 0); return;
  }
  route.last = path; window.scrollTo(0, 0);
  customerRoute(parts);
}
$('#role').onchange = e => { const b = S.role; S.role = e.target.value; logAudit(S.role, 'Prototype role switch', 'Session', b, S.role, ''); save(); const tgt = S.role === 'Customer' ? '#/me' : '#/admin'; if (location.hash === tgt) route(); else location.hash = tgt; };
addEventListener('hashchange', route);
if (S.mmOverrides) for (const id in S.mmOverrides) { if (MMI[id]) { MMI[id].median = S.mmOverrides[id].median; MMI[id].near = S.mmOverrides[id].near; } }
save(); route();
setInterval(() => { const b = JSON.stringify([S.requests.map(r=>r.status), S.leads.map(l=>l.stage)]); sweep(); if (JSON.stringify([S.requests.map(r=>r.status), S.leads.map(l=>l.stage)]) !== b) { save(); route(); } }, 60000);
</script>
</body>
</html>
