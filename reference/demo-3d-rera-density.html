document.getElementById('sub').textContent=`${fmt(P.length)} RERA-registered housing projects and ${fmt(totalHomes)} homes, mapped from public registration data.`;
const dl=document.getElementById('names');
const seen=new Set();P.forEach(p=>{if(!seen.has(p.n)){seen.add(p.n);const o=document.createElement('option');o.value=p.n;o.label=p.p;dl.appendChild(o);}});
P.forEach((p,i)=>{p.i=i;p.area=p.w||p.tk||'Bengaluru';});
// towers laid out as a small grid around each project's point
const T=[];
P.forEach(p=>{const t=Math.min(p.t||1,30),cols=Math.ceil(Math.sqrt(t)),sp=38,mlat=110540,mlng=111320*Math.cos(p.la*Math.PI/180);
 for(let k=0;k<t;k++){const cx=(k%cols)-(cols-1)/2,cy=Math.floor(k/cols)-(Math.ceil(t/cols)-1)/2;T.push({p,pos:[p.lo+cx*sp/mlng,p.la+cy*sp/mlat]});}});
const labels=(()=>{const top=[...H].sort((a,b)=>b.n-a.n),out=[],names=new Set();for(const h of top){if(!h.w||names.has(h.w))continue;names.add(h.w);out.push(h);if(out.length>=14)break;}return out;})();
let metric='n',sel=null,zoom=narrow?9.4:10.2,lastQ=-1,center=[77.6,12.96];
const maxN=Math.max(...H.map(h=>h.n)),maxU=Math.max(...H.map(h=>h.u));
const HOME={longitude:77.6,latitude:12.955,zoom:narrow?9.4:10.2,pitch:52,bearing:-18};
const light=new deck.LightingEffect({amb:new deck.AmbientLight({color:[255,255,255],intensity:1.05}),sun:new deck.DirectionalLight({color:[255,240,220],intensity:1.6,direction:[-3,-6,-4]})});
const MAT={ambient:.55,diffuse:.6,shininess:24,specularColor:[60,70,90]};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function fly(v,ms){D.setProps({initialViewState:Object.assign({},v,{transitionDuration:RM?0:(ms||1600),transitionInterpolator:new deck.FlyToInterpolator()})});}
function level(){return zoom<12.3?'city':zoom<15?'area':'project';}
function nearestArea(){let best=null,bd=1e9;for(const h of H){const d=(h.la-center[1])**2+(h.lo-center[0])**2;if(d<bd){bd=d;best=h;}}return best&&best.w||'Area';}
function layers(){
 const hexOp=clamp((12.7-zoom)/0.9,0,1),projOp=clamp((zoom-11.8)/0.9,0,1),twOp=clamp((zoom-14.4)/0.7,0,1),colOp=projOp*(1-twOp);
 const mx=metric==='n'?maxN:maxU;
 const L=[new deck.GeoJsonLayer({id:'wards',data:W,filled:true,stroked:true,getFillColor:[22,33,66,200],getLineColor:[52,74,120,255],lineWidthMinPixels:.6,pickable:true,autoHighlight:true,highlightColor:[60,90,150,90]})];
 if(hexOp>0.01){
  L.push(new deck.ColumnLayer({id:'hex',data:H,diskResolution:6,radius:1000,angle:90,coverage:.92,extruded:true,opacity:.92*hexOp,material:MAT,pickable:hexOp>.5,
   getPosition:h=>[h.lo,h.la],getElevation:h=>(metric==='n'?h.n/maxN:h.u/maxU)*9000+120,getFillColor:h=>ramp(Math.sqrt((metric==='n'?h.n:h.u)/mx)),
   updateTriggers:{getElevation:metric,getFillColor:metric},transitions:{getElevation:RM?0:700}}));
  L.push(new deck.TextLayer({id:'labels',data:labels,getPosition:h=>[h.lo,h.la,(metric==='n'?h.n/maxN:h.u/maxU)*9000+900],getText:h=>h.w,getSize:12,getColor:[233,238,248,Math.round(255*hexOp)],fontFamily:'Sora, system-ui, sans-serif',fontWeight:500,background:true,getBackgroundColor:[14,22,48,Math.round(210*hexOp)],backgroundPadding:[6,3],characterSet:'auto',updateTriggers:{getPosition:metric,getColor:hexOp}}));
 }
 if(colOp>0.01){
  L.push(new deck.ColumnLayer({id:'proj',data:P,diskResolution:4,angle:45,radius:42,extruded:true,opacity:colOp,material:MAT,pickable:true,autoHighlight:true,highlightColor:[255,255,255,200],
   getPosition:p=>[p.lo,p.la],getElevation:p=>p.fl*3.2*2.2,getFillColor:p=>sel&&sel!==p?[...STATUS[p.s][1].map(c=>c*.55)]:STATUS[p.s][1],updateTriggers:{getFillColor:sel&&sel.i}}));
 }
 if(twOp>0.01){
  L.push(new deck.PolygonLayer({id:'sites',data:P.filter(p=>p.pg),getPolygon:p=>p.pg,filled:true,stroked:true,getFillColor:p=>p===sel?[242,181,68,70]:[76,201,214,35],getLineColor:p=>p===sel?[242,181,68,255]:[76,201,214,160],lineWidthMinPixels:1.2,opacity:twOp,updateTriggers:{getFillColor:sel&&sel.i,getLineColor:sel&&sel.i}}));
  L.push(new deck.ColumnLayer({id:'towers',data:T,diskResolution:4,angle:45,radius:13,extruded:true,opacity:twOp,material:MAT,pickable:true,autoHighlight:true,highlightColor:[255,255,255,220],
   getPosition:d=>d.pos,getElevation:d=>d.p.fl*3.2,getFillColor:d=>d.p===sel?[255,236,190]:(sel?STATUS[d.p.s][1].map(c=>c*.5):STATUS[d.p.s][1]),updateTriggers:{getFillColor:sel&&sel.i}}));
 }
 return L;
}
function render(){D.setProps({layers:layers()});crumbs();}
function crumbs(){
 const lv=level(),a=document.getElementById('c-area'),p=document.getElementById('c-proj'),c=document.getElementById('c-city');
 a.disabled=lv==='city';a.textContent=lv==='city'?'Area':(sel?sel.area:nearestArea());
 p.disabled=!sel;p.textContent=sel?sel.n:'Project';
 c.setAttribute('aria-current',lv==='city');a.setAttribute('aria-current',lv==='area'&&!sel);p.setAttribute('aria-current',!!sel);
 document.getElementById('hint').textContent=lv==='city'?'Tap a column to zoom into that area':lv==='area'?'Tap a building to open the project':'Drag to orbit · pinch or scroll to zoom';
}
function legend(){const n=metric==='n';document.getElementById('lg-title').textContent=n?'Projects per 1 km cell':'Homes per 1 km cell';document.getElementById('lg-max').textContent=(n?fmt(maxN)+' projects':fmt(maxU)+' homes');}
function openCard(p){
 sel=p;const s=STATUS[p.s],acres=p.ld?(p.ld/4046.86):null;
 document.getElementById('cardBody').innerHTML=`<span class="pill" style="background:rgb(${s[1]});color:#14110a">${s[0]}</span><h2></h2><p class="by"></p>
 <dl><dt>RERA no.</dt><dd id="rg"></dd><dt>Area</dt><dd id="ar"></dd><dt>Towers</dt><dd>${fmt(p.t)}</dd><dt>Homes</dt><dd>${fmt(p.u)}</dd>
 <dt>Land</dt><dd>${acres?acres.toFixed(acres<10?2:1)+' acres':'—'}</dd><dt>FAR</dt><dd>${p.f??'—'}</dd><dt>Completion</dt><dd>${p.c||'—'}</dd><dt>Est. floors</dt><dd>~${p.fl}</dd></dl>
 <p class="note">Floors are an estimate. Prices, plans and photos come from the developer, not RERA.</p>`;
 const b=document.getElementById('cardBody');b.querySelector('h2').textContent=p.n;b.querySelector('.by').textContent='by '+p.p;b.querySelector('#rg').textContent=p.rg;b.querySelector('#ar').textContent=p.area+(p.pin?' '+p.pin:'');
 document.getElementById('card').classList.add('open');
 fly({longitude:p.lo,latitude:p.la-(narrow?0.0016:0),zoom:16.3,pitch:62,bearing:-30},1800);render();
}
function closeCard(){sel=null;document.getElementById('card').classList.remove('open');render();}
const D=new deck.DeckGL({container:'map',initialViewState:HOME,controller:{doubleClickZoom:true,touchRotate:true},effects:[light],
 parameters:{clearColor:[0,0,0,0]},layers:[],
 onViewStateChange:({viewState})=>{center=[viewState.longitude,viewState.latitude];const q=Math.round(viewState.zoom*10);if(q!==lastQ){lastQ=q;zoom=viewState.zoom;render();}},
 getTooltip:({object,layer})=>{if(!object||!layer)return null;const st={background:'rgba(14,22,48,.95)',color:'#e9eef8',font:'500 12px Sora, system-ui, sans-serif',border:'1px solid #2b3d63',borderRadius:'8px',padding:'6px 9px'};
  if(layer.id==='hex')return{text:`${object.w||'Bengaluru'}\n${fmt(object.n)} projects, ${fmt(object.u)} homes`,style:st};
  if(layer.id==='proj')return{text:`${object.n}\n${object.p}`,style:st};
  if(layer.id==='towers')return{text:`${object.p.n}\n~${object.p.fl} floors (est.)`,style:st};
  if(layer.id==='wards'&&level()!=='city')return{text:object.properties.n,style:st};return null;},
 onClick:({object,layer})=>{if(!object||!layer)return;
  if(layer.id==='hex'){fly({longitude:object.lo,latitude:object.la,zoom:13.6,pitch:58,bearing:-24});}
  else if(layer.id==='proj')openCard(object);else if(layer.id==='towers')openCard(object.p);}
});
document.getElementById('c-city').onclick=()=>{closeCard();fly(HOME);};
document.getElementById('c-area').onclick=()=>{const s=sel;closeCard();fly({longitude:s?s.lo:center[0],latitude:s?s.la:center[1],zoom:13.6,pitch:58,bearing:-24});};
document.getElementById('c-proj').onclick=()=>{if(sel)openCard(sel);};
document.getElementById('close').onclick=closeCard;
document.getElementById('q').addEventListener('change',e=>{const v=e.target.value.trim().toLowerCase();if(!v)return;const p=P.find(x=>x.n.toLowerCase()===v)||P.find(x=>x.n.toLowerCase().includes(v)||x.p.toLowerCase().includes(v));if(p){openCard(p);e.target.blur();}});
function setMetric(m){metric=m;document.getElementById('m-n').setAttribute('aria-pressed',m==='n');document.getElementById('m-u').setAttribute('aria-pressed',m==='u');legend();render();}
document.getElementById('m-n').onclick=()=>setMetric('n');document.getElementById('m-u').onclick=()=>setMetric('u');
addEventListener('keydown',e=>{if(e.key==='Escape'&&sel)closeCard();});
legend();zoom=HOME.zoom;render();
})();
</script>
</body>
</html>
