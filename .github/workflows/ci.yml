name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @arrakis/web lint
      - run: pnpm --filter @arrakis/web typecheck
      - run: pnpm --filter @arrakis/web test
      - run: pnpm --filter @arrakis/web build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: arrakis_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s
          --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @arrakis/db
      - run: pnpm --filter @arrakis/db test
        env:
          TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/arrakis_test?sslmode=disable

  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/rera-pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  images:
    needs: [web, db, pipeline]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Build pipeline image
        uses: docker/build-push-action@v6
        with:
          context: services/rera-pipeline
          push: false
          cache-from: type=gha,scope=pipeline
          cache-to: type=gha,mode=max,scope=pipeline
      - name: Build migrate image
        uses: docker/build-push-action@v6
        with:
          context: packages/db
          push: false
